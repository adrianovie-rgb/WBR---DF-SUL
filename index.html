function CALLOUT(nodes,meta,vals,unit){
  // nodes: array of nodes to evaluate (or pre-filtered list if meta/vals not provided)

  if(meta!=null&&vals!=null){
    filtered=nodes.filter(function(nd){
      var v=vals[nd];return v!=null&&v<meta;

  }
  if(filtered.length===0)return '';
  var h="<div class='callout-box'><h4>&#128221; Callout &mdash; Justificativas (abaixo da meta)</h4>";
  for(var i=0;i<filtered.length;i++){
    var nd=filtered[i];
