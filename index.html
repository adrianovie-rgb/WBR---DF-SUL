<script>

var NA=["ECB8","EGO8","EIJ8","EJO8","ELO8","EME8","EMR8","ERS8","ESB8","ESE8","EUM8","EVE8"];
function T(i){var t=document.querySelectorAll('.tab'),c=document.querySelectorAll('.content');for(var x=0;x<t.length;x++){t[x].classList.toggle('active',x===i);c[x].classList.toggle('active',x===i);}setTimeout(AB,150);}
function F(n){return Math.round(n).toLocaleString('pt-BR');}
function B(t){return t==='SPC'?'<span class="bg bg-s">SPC</span>':'<span class="bg bg-p">PN</span>';}
function AB(){var b=document.querySelectorAll('.rb:not(.an)');for(var i=0;i<b.length;i++)b[i].classList.add('an');}
function SF(){var e=document.getElementById('sm');if(!e)return;e.style.fontFamily=document.getElementById('sf').value;e.style.fontSize=document.getElementById('ss').value+'px';e.style.color=document.getElementById('sc').value;}
function CALLOUT(nodes){var h='<div class="callout-box"><h4>\ud83d\udcdd Callout \u2014 Justificativas</h4>';for(var i=0;i<nodes.length;i++){h+='<div class="callout-item"><span class="node-tag">'+nodes[i]+'</span><div class="editable" contenteditable="true"></div></div>';}h+='</div>';return h;}

function buildNodeChart(svgId,nodes,vPrev,v20,v21,meta,yMin,yMax){var svg=document.getElementById(svgId);if(!svg)return;var NW=nodes.length,W=960,H=430,padL=70,padR=30,padT=45,padB=80;var chartW=W-padL-padR,chartH=H-padT-padB,xStep=chartW/(NW-1),range=yMax-yMin;var ORG='rgb(249,115,22)',BLU='rgb(59,130,246)',RED='rgb(231,76,60)';var s='';for(var g=0;g<=6;g++){var gVal=yMin+(range/6)*g;var gy=padT+chartH-((gVal-yMin)/range)*chartH;s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="rgb(233,236,239)" stroke-width="1"/>';s+='<text x="'+(padL-10)+'" y="'+(gy+4)+'" fill="rgb(102,102,102)" text-anchor="end" font-size="10">'+gVal.toFixed(1)+'</text>';}for(var w=0;w<NW;w++){var x=padL+w*xStep;s+='<text x="'+x+'" y="'+(H-padB+20)+'" fill="rgb(55,71,90)" text-anchor="middle" font-size="12" font-weight="600">'+nodes[w]+'</text>';s+='<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(H-padB)+'" stroke="rgb(241,243,245)" stroke-width="1"/>';}var metaY=padT+chartH-((meta-yMin)/range)*chartH;s+='<line x1="'+padL+'" y1="'+metaY+'" x2="'+(W-padR)+'" y2="'+metaY+'" stroke="'+RED+'" stroke-width="2" stroke-dasharray="8,4"/>';var datasets=[{name:"W-0",data:v20,color:ORG},{name:"W+1",data:v21,color:BLU}];for(var d=0;d<datasets.length;d++){var ds=datasets[d],pts=[];for(var w=0;w<NW;w++){var x=padL+w*xStep,y=padT+chartH-((ds.data[w]-yMin)/range)*chartH;pts.push(x+','+y);}s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+ds.color+'" stroke-width="2.5"/>';for(var w=0;w<NW;w++){var x=padL+w*xStep,y=padT+chartH-((ds.data[w]-yMin)/range)*chartH;s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="'+ds.color+'" stroke="#fff" stroke-width="2"/>';}}for(var w=0;w<NW;w++){var x=padL+w*xStep;var labels=[];for(var d=0;d<datasets.length;d++){var ds=datasets[d],y=padT+chartH-((ds.data[w]-yMin)/range)*chartH;labels.push({y:y,val:ds.data[w],color:ds.color});}labels.sort(function(a,b){return a.y-b.y;});for(var p=0;p<3;p++){for(var i=1;i<labels.length;i++){var diff=labels[i].y-labels[i-1].y;if(diff<22){var sh=(22-diff)/2;labels[i-1].y-=sh;labels[i].y+=sh;}}}for(var i=0;i<labels.length;i++){var lb=labels[i],lbl=lb.val.toFixed(2),tw=lbl.length*6.5+10;s+='<rect x="'+(x-tw/2)+'" y="'+(lb.y-9)+'" width="'+tw+'" height="17" rx="4" fill="'+lb.color+'" opacity="0.92"/>';s+='<text x="'+x+'" y="'+(lb.y+4)+'" fill="#fff" text-anchor="middle" font-size="10" font-weight="700">'+lbl+'</text>';}}var lY=H-25;s+='<line x1="'+padL+'" y1="'+lY+'" x2="'+(padL+30)+'" y2="'+lY+'" stroke="'+ORG+'" stroke-width="3"/>';s+='<circle cx="'+(padL+15)+'" cy="'+lY+'" r="4" fill="'+ORG+'" stroke="#fff" stroke-width="1.5"/>';s+='<text x="'+(padL+38)+'" y="'+(lY+4)+'" fill="rgb(55,71,90)" font-size="11" font-weight="600">W-0 (W20) Refer\u00eancia</text>';var lx2=padL+240;s+='<line x1="'+lx2+'" y1="'+lY+'" x2="'+(lx2+30)+'" y2="'+lY+'" stroke="'+BLU+'" stroke-width="3"/>';s+='<circle cx="'+(lx2+15)+'" cy="'+lY+'" r="4" fill="'+BLU+'" stroke="#fff" stroke-width="1.5"/>';s+='<text x="'+(lx2+38)+'" y="'+(lY+4)+'" fill="rgb(55,71,90)" font-size="11" font-weight="600">W+1 (W21*) Parcial</text>';var lx3=padL+460;s+='<line x1="'+lx3+'" y1="'+lY+'" x2="'+(lx3+30)+'" y2="'+lY+'" stroke="'+RED+'" stroke-width="2" stroke-dasharray="8,4"/>';s+='<text x="'+(lx3+38)+'" y="'+(lY+4)+'" fill="rgb(55,71,90)" font-size="11" font-weight="600">Meta '+meta+'</text>';svg.innerHTML=s;}
function DM(id,wks,sr,meta){var regs=[],dataObj={},colors={};var cl=['rgb(30,58,95)','rgb(124,58,237)','rgb(107,114,128)','rgb(249,115,22)','rgb(16,185,129)'];for(var i=0;i<sr.length;i++){regs.push(sr[i].n);dataObj[sr[i].n]=sr[i].d;colors[sr[i].n]=cl[i%5];}var allV=[];for(var i=0;i<sr.length;i++){for(var j=0;j<sr[i].d.length;j++){if(sr[i].d[j]!==null)allV.push(sr[i].d[j]);}}var mn=Math.min.apply(null,allV)*0.92,mx=Math.max.apply(null,allV)*1.04;var svg=document.getElementById(id);if(!svg)return;var NW=wks.length,W=960,H=400,padL=70,padR=30,padT=45,padB=70;var chartW=W-padL-padR,chartH=H-padT-padB,xStep=chartW/(NW-1),range=mx-mn;var s='';for(var g=0;g<=6;g++){var gVal=mn+(range/6)*g;var gy=padT+chartH-((gVal-mn)/range)*chartH;s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="rgb(233,236,239)"/>';s+='<text x="'+(padL-10)+'" y="'+(gy+4)+'" fill="rgb(102,102,102)" text-anchor="end" font-size="10">'+gVal.toFixed(0)+'</text>';}for(var w=0;w<NW;w++){var x=padL+w*xStep;s+='<text x="'+x+'" y="'+(H-padB+20)+'" fill="rgb(55,71,90)" text-anchor="middle" font-size="11" font-weight="600">'+wks[w]+'</text>';}if(meta!==null){var metaY=padT+chartH-((meta-mn)/range)*chartH;s+='<line x1="'+padL+'" y1="'+metaY+'" x2="'+(W-padR)+'" y2="'+metaY+'" stroke="rgb(231,76,60)" stroke-width="2" stroke-dasharray="8,4"/>';}for(var r=0;r<regs.length;r++){var reg=regs[r],vals=dataObj[reg],color=colors[reg],pts=[];for(var w=0;w<NW;w++){if(vals[w]===null)continue;var x=padL+w*xStep,y=padT+chartH-((vals[w]-mn)/range)*chartH;pts.push(x+','+y);}s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>';for(var w=0;w<NW;w++){if(vals[w]===null)continue;var x=padL+w*xStep,y=padT+chartH-((vals[w]-mn)/range)*chartH;s+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>';}}var lY=H-20,lX=padL;for(var r=0;r<regs.length;r++){s+='<rect x="'+lX+'" y="'+(lY-5)+'" width="12" height="12" rx="2" fill="'+colors[regs[r]]+'"/
